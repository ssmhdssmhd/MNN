name: android-build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'doc/**'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_VERSION: "0.0.9"

jobs:
  build_mnn_libs:
    name: 编译 MNN 原生库 (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            script: build_64.sh
            dir: build_64
          - abi: armeabi-v7a
            script: build_32.sh
            dir: build_32
    steps:
      - uses: actions/checkout@v4

      - name: 安装 NDK 与 CMake
        run: |
          NDK_VERSION=27.2.12479018
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            yes | "$SDKMANAGER" "ndk;$NDK_VERSION" > /dev/null
          fi
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            yes | "$SDKMANAGER" "cmake;3.22.1" > /dev/null
          fi
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: 编译并安装 ${{ matrix.abi }} 库
        run: |
          set -e
          cd project/android
          rm -rf "${{ matrix.dir }}"
          mkdir "${{ matrix.dir }}"
          cd "${{ matrix.dir }}"
          PREFIX="$PWD"
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            EXTRA="-DMNN_BUILD_LLM=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DMNN_ARM82=true -DLLM_SUPPORT_VISION=true -DMNN_BUILD_OPENCV=true -DMNN_IMGCODECS=true -DLLM_SUPPORT_AUDIO=true -DMNN_BUILD_AUDIO=true -DMNN_BUILD_DIFFUSION=ON"
          else
            EXTRA="-DMNN_ARM82=false -DMNN_BUILD_LLM=false -DMNN_BUILD_OPENCV=false -DMNN_BUILD_DIFFUSION=false"
          fi
          ../${{ matrix.script }} "-DMNN_USE_LOGCAT=true -DMNN_OPENCL=true -DMNN_SEP_BUILD=OFF -DMNN_JNI=TRUE -DMNN_BUILD_TEST=OFF -DMNN_BUILD_BENCHMARK=OFF -DMNN_LOW_MEMORY=true -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true $EXTRA -DCMAKE_INSTALL_PREFIX=$PREFIX"
          make install
          ls -lh lib
          JNI_LIB=$(find . -name libmnncore.so -type f | head -n 1)
          if [ -n "$JNI_LIB" ]; then
            cp "$JNI_LIB" lib/
          fi
          ls -lh lib

      - name: 上传原生库
        uses: actions/upload-artifact@v4
        with:
          name: mnn_libs_${{ matrix.abi }}
          path: project/android/${{ matrix.dir }}/lib
          if-no-files-found: error
          retention-days: 7

  build_demo_models:
    name: 生成 Demo 模型
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译 MNNConvert
        run: |
          set -e
          mkdir -p build
          cd build
          cmake -DMNN_BUILD_CONVERTER=ON -DMNN_BUILD_TEST=OFF -DMNN_BUILD_BENCHMARK=OFF ..
          make -j"$(nproc)" MNNConvert

      - name: 下载并转换模型
        run: |
          set -e
          mkdir -p resource/build resource/model/MobileNet/v2 resource/model/SqueezeNet/v1.1 resource/model/Portrait
          curl -fL --retry 5 --retry-all-errors -o resource/build/mobilenet_v2.caffemodel \
            https://raw.githubusercontent.com/shicai/MobileNet-Caffe/master/mobilenet_v2.caffemodel
          curl -fL --retry 5 --retry-all-errors -o resource/build/mobilenet_v2.prototxt \
            https://raw.githubusercontent.com/shicai/MobileNet-Caffe/master/mobilenet_v2_deploy.prototxt
          curl -fL --retry 5 --retry-all-errors -o resource/build/squeezenet_v1.1.caffemodel \
            https://raw.githubusercontent.com/DeepScale/SqueezeNet/b6b5ae2ce884a3866c21efd31e103defde8631ae/SqueezeNet_v1.1/squeezenet_v1.1.caffemodel
          curl -fL --retry 5 --retry-all-errors -o resource/build/squeezenet_v1.1.prototxt \
            https://raw.githubusercontent.com/DeepScale/SqueezeNet/b6b5ae2ce884a3866c21efd31e103defde8631ae/SqueezeNet_v1.1/deploy.prototxt
          curl -fL --retry 5 --retry-all-errors -o resource/build/deeplabv3.tflite \
            https://storage.googleapis.com/download.tensorflow.org/models/tflite/gpu/deeplabv3_257_mv_gpu.tflite
          ./build/MNNConvert -f CAFFE --modelFile resource/build/mobilenet_v2.caffemodel \
            --prototxt resource/build/mobilenet_v2.prototxt \
            --MNNModel resource/model/MobileNet/v2/mobilenet_v2.caffe.mnn --bizCode MNN
          ./build/MNNConvert -f CAFFE --modelFile resource/build/squeezenet_v1.1.caffemodel \
            --prototxt resource/build/squeezenet_v1.1.prototxt \
            --MNNModel resource/model/SqueezeNet/v1.1/squeezenet_v1.1.caffe.mnn --bizCode MNN
          ./build/MNNConvert -f TFLITE --modelFile resource/build/deeplabv3.tflite \
            --MNNModel resource/model/Portrait/Portrait.tflite.mnn --bizCode MNN
          ls -lh resource/model/MobileNet/v2/*.mnn resource/model/SqueezeNet/v1.1/*.mnn resource/model/Portrait/*.mnn

      - name: 上传模型
        uses: actions/upload-artifact@v4
        with:
          name: demo_models
          path: resource/model
          if-no-files-found: error
          retention-days: 7

  build_demo_apk:
    name: 编译 MNN Demo APK
    needs: [build_mnn_libs, build_demo_models]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 下载原生库与模型
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 组装 jniLibs 与 assets
        run: |
          set -e
          mkdir -p project/android/demo/app/libs
          cp -r artifacts/mnn_libs_arm64-v8a project/android/demo/app/libs/arm64-v8a
          cp -r artifacts/mnn_libs_armeabi-v7a project/android/demo/app/libs/armeabi-v7a
          cp -r artifacts/demo_models/. resource/model/
          find project/android/demo/app/libs -name '*.so' | sort

      - name: Gradle 编译 Debug APK
        run: |
          set -e
          cd project/android/demo
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: 重命名并归档 APK
        run: |
          set -e
          TS=$(date -u +%Y%m%d%H%M)
          NAME="MNN.Demo.${APP_VERSION}.${TS}"
          mkdir -p out
          cp project/android/demo/app/build/outputs/apk/debug/app-debug.apk "out/${NAME}.apk"
          cp "out/${NAME}.apk" out/MNN.Demo.latest.apk
          echo "APK_NAME=${NAME}" >> "$GITHUB_ENV"
          ls -lh out

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: mnn_demo_apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

  build_chat_apk:
    name: 编译 MnnLlmChat APK
    needs: [build_mnn_libs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 NDK 与 CMake
        run: |
          NDK_VERSION=27.2.12479018
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            yes | "$SDKMANAGER" "ndk;$NDK_VERSION" > /dev/null
          fi
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            yes | "$SDKMANAGER" "cmake;3.22.1" > /dev/null
          fi
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: 下载原生库
        uses: actions/download-artifact@v4
        with:
          name: mnn_libs_arm64-v8a
          path: artifacts/mnn_libs_arm64-v8a

      - name: 准备 MNN 预编译库
        run: |
          set -e
          mkdir -p project/android/build_64/lib
          rm -f project/android/build_64/lib/*.so
          cp -r artifacts/mnn_libs_arm64-v8a/. project/android/build_64/lib/
          ls -lh project/android/build_64/lib

      - name: Gradle 编译 Standard Debug APK
        env:
          ENABLE_FIREBASE: 'false'
        run: |
          set -e
          cd apps/Android/MnnLlmChat
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleStandardDebug -PappVersion="${APP_VERSION}"

      - name: 重命名并归档 APK
        run: |
          set -e
          TS=$(date -u +%Y%m%d%H%M)
          NAME="MNN.Chat.${APP_VERSION}.${TS}"
          mkdir -p out
          cp apps/Android/MnnLlmChat/app/build/outputs/apk/standard/debug/app-standard-debug.apk "out/${NAME}.apk"
          cp "out/${NAME}.apk" out/MNN.Chat.latest.apk
          ls -lh out

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: mnn_chat_apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: 发布 APK
    needs: [build_demo_apk, build_chat_apk]
    runs-on: ubuntu-latest
    steps:
      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          path: apks
          pattern: 'mnn_*_apk'
          merge-multiple: true

      - name: 发布到 latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          ls -lh apks
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest apks/*.apk --clobber
          else
            gh release create latest apks/*.apk \
              --prerelease \
              --title "MNN Android 最新构建" \
              --notes "由 GitHub Actions 自动构建，包含 MNN Demo 与 MnnLlmChat 两个 APK。"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" apks/*.apk --title "$TAG" --notes "版本 $TAG"
          fi
